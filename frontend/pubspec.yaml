name: kalasetu
description: "KalaSetu: Handloom and Handicraft Marketplace connecting rural artisans to the world."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.1.4

  # Backend & Auth
  supabase_flutter: ^2.5.4
  google_sign_in: ^6.2.1

  # Camera & Media
  camera: ^0.10.5+9
  image_picker: ^1.1.0
  permission_handler: ^11.3.1
  record: ^5.1.0

  # Network & UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/mock/
    - .env
